# Modell-IDs durch tatsächlich bereitgestellte Modelle ersetzen.
# Kein Netzwerkzugriff beim Laden dieser Datei.
[roles.verwalter]
provider = "local"
base_url = "http://127.0.0.1:8000/v1"
model = "lokales-wirtschaftsmodell"
max_tokens = 1024
max_requests = 1000

[roles.feldherr]
provider = "local"
base_url = "http://127.0.0.1:8001/v1"
model = "lokales-militaermodell"
max_tokens = 1024
max_requests = 1000

[roles.diplomat]
provider = "local"
base_url = "http://127.0.0.1:8002/v1"
model = "lokales-diplomatiemodell"
max_tokens = 1024
max_requests = 1000

[roles.stratege]
provider = "local"
base_url = "http://127.0.0.1:8003/v1"
model = "lokales-strategiemodell"
max_tokens = 1024
max_requests = 1000

