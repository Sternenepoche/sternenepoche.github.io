[project]
name = "sternenepoche"
version = "0.1.0"
description = "Orchestrator für Sternenepoche: Lagebilder, Rollen, lokale Modelle und OpenRouter"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[project.scripts]
sternenepoche-lauf = "sternenepoche.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["sternenepoche"]
