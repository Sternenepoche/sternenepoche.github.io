[package]
name = "spieler"
version.workspace = true
edition.workspace = true
description = "Native Rust player mode using the authoritative Sternenepoche simulation"

[[bin]]
name = "sternenepoche-spieler"
path = "src/main.rs"

[[bin]]
name = "sternenepoche-browser"
path = "src/browser.rs"

[dependencies]
kern = { path = "../kern" }
lauf = { path = "../lauf" }
inhalt = { path = "../inhalt" }
sternenepoche-agenten = { path = "../agenten" }
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
image = { version = "0.25", default-features = false, features = ["png"] }

