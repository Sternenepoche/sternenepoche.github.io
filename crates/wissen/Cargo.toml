[package]
name = "wissen"
version.workspace = true
edition.workspace = true
description = "Versioned Sternenepoche knowledge in DuckDB, with native Rust API and MCP"

[dependencies]
kern = { path = "../kern" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
libloading = "0.8"
base64 = "0.22"
tiny_http = "0.12"

[[bin]]
name = "sternenepoche-wissen"
path = "src/main.rs"
