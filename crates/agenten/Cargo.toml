[package]
name = "sternenepoche-agenten"
version.workspace = true
edition.workspace = true
description = "Rust-Modellorchestrierung mit direktem Spielkern und persistentem Entscheidungsjournal"
default-run = "sternenepoche-agenten"

[dependencies]
kern = { path = "../kern" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
fs2 = "0.4"
parquet = { version = "56", default-features = false }
rusqlite = { version = "0.32", features = ["bundled", "backup"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Isolation", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_Memory", "Win32_System_ProcessStatus"] }

[[bin]]
name = "sternenepoche-labor"
path = "src/labor/main.rs"
