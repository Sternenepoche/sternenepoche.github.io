name: Check shared Rust world

on:
  workflow_call:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install public image encoder
        run: python -m pip install Pillow==12.2.0
      - name: Test game rules and authoritative server
        run: cargo test --release --locked -p kern -p lauf -p sternenepoche-server
      - name: Verify model agent scheduling, restart and replay
        run: cargo test --release --locked -p sternenepoche-agenten --test labor_runtime
      - name: Build Linux service
        run: cargo build --release --locked -p sternenepoche-server
      - name: Verify HTTP, restart, privacy and resets
        run: python3 tools/online_smoke.py
      - name: Verify TOTP, recovery, email codes and private player database
        run: python3 tools/identity_smoke.py
      - name: Verify browser agent transport and limits
        run: node tools/browser_agent_test.cjs
      - name: Verify private dashboard script startup and rule preview
        run: node tools/admin_browser_test.cjs
      - name: Verify game timers, navigation and packaged artwork
        run: node tools/game_ui_test.cjs
      - name: Verify deliberately public Pages sources
        run: python tools/build_pages.py
      - name: Verify player documentation and private operator boundary
        run: python tools/player_publication_test.py
