# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.scope.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: scope
        name: Determine whether game code changed
        env:
          BEFORE: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import os, subprocess
          before = os.environ.get('BEFORE', '')
          public_files = {'Technologiebaum.html', 'Weltenkruemmer.html', 'Lore.html', 'content/beschreibungen.json', 'web-client/ai-labels.js', 'web-client/three.min.js',
              'index.html', 'KI-Hinweis.html', 'Sternenepoche-Start.html',
              'Sternenepoche-Handbuch.html', 'Sternenepoche-Kodex.html', 'Harness-Cockpit.html',
              'Download.html', 'sitemap.xml', 'robots.txt', 'llms.txt', '_config.yml',
              'web-client/art.js', 'web-client/technology-rules.js', 'web-client/public-techtree.js',
              'web-client/public-techtree.css', '.github/workflows/static.yml',
              'tools/website_content.py', 'tools/site_policy.py', 'tools/sync_website_catalog.py',
              'tools/player_publication_test.py', 'tools/verify_fleet_website.py',
              'tools/build_pages.py', 'tools/build_website.py', 'tools/build_fleet_codex.py',
              'tools/build_landingpage.py', 'tools/build_startpage.py', 'tools/build_handbook.py',
              'tools/build_cockpitpage.py', 'tools/build_downloadpage.py'}
          if os.environ['EVENT_NAME'] != 'push' or not before.strip('0'):
              backend = True
          else:
              paths = subprocess.check_output(['git', 'diff', '--name-only', before, 'HEAD'], text=True).splitlines()
              backend = any(p not in public_files and not p.startswith(('docs/', 'web-client/assets/', 'web-client/techbaum/', 'web-client/fonts/', 'seite/', 'tools/website/', 'lore/')) for p in paths)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('backend=' + str(backend).lower() + '\n')
          print('Game checks required:', backend)
          PY
  verify:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    uses: ./.github/workflows/online-checks.yml
  # Single deploy job since we're just deploying
  deploy:
    needs: [changes, verify]
    if: always() && needs.changes.result == 'success' && (needs.verify.result == 'success' || needs.verify.result == 'skipped')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install image encoder
        run: python -m pip install Pillow==12.2.0
      - name: Prepare public sources
        run: python3 tools/build_pages.py
      - name: Verify public pages and links
        run: python3 tools/player_publication_test.py
      - name: Build public documentation
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./.pages-artifact/source
          destination: ./.pages-artifact/site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: './.pages-artifact/site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
