  body{background:radial-gradient(ellipse at 90% 10%,#44356e33,transparent 45%),radial-gradient(ellipse at 5% 55%,#12576528,transparent 50%),#050b14;color:#dae5f1}

<style id="site-ai-notice-style">.site-ai-notice{box-sizing:border-box;position:relative;z-index:6;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:4px 12px;margin:0;padding:8px 16px;background:#10212d;color:#d3e3e8;border-bottom:1px solid #38515d;font:12px/1.6 system-ui,'Segoe UI',sans-serif;letter-spacing:0;text-align:center}
.site-ai-notice .site-ai-tag{display:inline-block;padding:0 7px;border:1px solid #729e9c;border-radius:4px;color:#bce9de;font-weight:700;letter-spacing:.05em}
.site-ai-notice a{display:inline-flex;align-items:center;min-height:28px;color:#f2d3a2;text-decoration:underline;text-underline-offset:3px;font:inherit;white-space:nowrap}
.site-ai-notice a:focus-visible{outline:2px solid #f2d3a2;outline-offset:3px}
@media(max-width:480px){.site-ai-notice{font-size:11px;padding:7px 12px;gap:2px 8px}.site-ai-notice .site-ai-description{flex-basis:calc(100% - 50px);text-align:left}}
.ai-image-label{box-sizing:border-box;position:absolute;z-index:5;display:block;width:auto;min-width:0;margin:0;padding:1px 3px;border:1px solid #ffffff42;border-radius:3px;background:#07111dd9;color:#fff;font:600 8px/1.2 system-ui,'Segoe UI',sans-serif;letter-spacing:.03em;text-align:center;white-space:nowrap;pointer-events:none;transform:translate(-100%,-100%)}
.ai-image-label[hidden]{display:none!important}
.ai-background-label{right:3px;bottom:3px;transform:none}
.ai-page-label{position:fixed}</style>

<script id="site-ai-labels">// One small label per displayed image, including images added by the game UI.
(() => {
  'use strict';
  const labels = new Map();
  const selector = 'img:not(.art-color), canvas, [data-ai-image]';
  let scheduled = false;
  const resize = new ResizeObserver(schedule);

  function schedule() {
    if (scheduled) return;
    scheduled = true;
    requestAnimationFrame(update);
  }

  function update() {
    scheduled = false;
    for (const [source, label] of labels) {
      if (!source.isConnected || label.parentElement !== hostFor(source)) {
        resize.unobserve(source);
        label.remove();
        labels.delete(source);
      }
    }
    for (const source of document.querySelectorAll(selector)) {
      if (labels.has(source)) continue;
      const host = hostFor(source);
      if (!host) continue;
      if (getComputedStyle(host).position === 'static') host.style.position = 'relative';
      const label = document.createElement('span');
      label.className = 'ai-image-label';
      label.textContent = 'KI';
      label.setAttribute('aria-hidden', 'true');
      if (source.hasAttribute('data-ai-image')) label.classList.add('ai-background-label');
      if (source === document.body) label.classList.add('ai-page-label');
      host.append(label);
      labels.set(source, label);
      resize.observe(source);
    }
    for (const [source, label] of labels) {
      label.hidden = !source.getClientRects().length || !source.offsetWidth || !source.offsetHeight
        || (source.tagName === 'IMG' && (!source.complete || !source.naturalWidth));
      if (source.hasAttribute('data-ai-image')) continue;
      // Sibling overlays preserve existing grid, flex and absolute image layouts.
      label.style.left = `${source.offsetLeft + source.offsetWidth - 2}px`;
      label.style.top = `${source.offsetTop + source.offsetHeight - 2}px`;
    }
  }

  function hostFor(source) {
    return source.hasAttribute('data-ai-image') ? source : source.parentElement;
  }

  function start() {
    new MutationObserver(records => {
      if (records.some(record => record.type === 'attributes'
        ? !record.target.classList.contains('ai-image-label')
        : [...record.addedNodes, ...record.removedNodes].some(node =>
          node.nodeType === 1 && !node.classList.contains('ai-image-label')))) schedule();
    }).observe(document.body, {subtree: true, childList: true, attributes: true,
      attributeFilter: ['src', 'hidden', 'class', 'open']});
    document.addEventListener('load', schedule, true);
    document.addEventListener('error', schedule, true);
    window.addEventListener('resize', schedule);
    document.fonts?.ready.then(schedule);
    schedule();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start, {once: true});
  else start();
})();
</script>
