<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src &#x27;none&#x27;; script-src &#x27;self&#x27;; style-src &#x27;self&#x27; &#x27;unsafe-inline&#x27;; img-src &#x27;self&#x27; data:; font-src &#x27;self&#x27;; connect-src &#x27;self&#x27;; media-src &#x27;self&#x27;; frame-src &#x27;none&#x27;; object-src &#x27;none&#x27;; worker-src &#x27;none&#x27;; base-uri &#x27;none&#x27;; form-action &#x27;self&#x27;">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title }} · Sternenepoche</title>
<style>
  :root{ --bg:#0b0e14; --panel:#131826; --line:#232a3d; --text:#dfe6f3; --muted:#8b96ad; --accent:#6ea8ff; --gold:#e8c37a; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:16px/1.65 "Segoe UI",system-ui,sans-serif}
  header{border-bottom:1px solid var(--line);background:linear-gradient(180deg,#101524,#0b0e14);position:sticky;top:0;z-index:5}
  .bar{max-width:960px;margin:0 auto;padding:14px 20px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
  .brand{font-weight:700;letter-spacing:.06em;color:var(--gold);text-decoration:none;font-size:17px}
  nav a{color:var(--muted);text-decoration:none;font-size:14.5px;margin-left:4px;padding:6px 10px;border-radius:8px}
  nav a:hover{color:var(--text);background:var(--panel)}
  main{max-width:960px;margin:0 auto;padding:32px 20px 80px}
  h1{font-size:30px;line-height:1.25;margin:.2em 0 .5em;color:#fff}
  h2{font-size:22px;margin-top:1.8em;color:#fff;border-bottom:1px solid var(--line);padding-bottom:.35em}
  h3{font-size:17.5px;margin-top:1.6em;color:var(--gold)}
  a{color:var(--accent)}
  code{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:1px 6px;font-size:.92em;
       font-family:Cascadia Code,Consolas,monospace}
  pre{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;overflow:auto}
  pre code{border:none;background:none;padding:0}
  table{border-collapse:collapse;width:100%;margin:14px 0;font-size:14.5px;display:block;overflow-x:auto}
  th,td{border:1px solid var(--line);padding:7px 11px;text-align:left}
  th{background:var(--panel);color:var(--gold)}
  tr:nth-child(even) td{background:#101522}
  blockquote{border-left:3px solid var(--accent);margin:14px 0;padding:4px 16px;color:var(--muted)}
  hr{border:none;border-top:1px solid var(--line);margin:28px 0}
  img{max-width:100%;border-radius:10px;border:1px solid var(--line)}
  footer{max-width:960px;margin:0 auto;padding:24px 20px 60px;color:var(--muted);font-size:13.5px;border-top:1px solid var(--line)}
  .crumb{color:var(--muted);font-size:13.5px;margin-bottom:18px}
</style>
<style id="site-ai-notice-style">.site-ai-notice{box-sizing:border-box;position:relative;z-index:6;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:4px 12px;margin:0;padding:8px 16px;background:#10212d;color:#d3e3e8;border-bottom:1px solid #38515d;font:12px/1.6 system-ui,'Segoe UI',sans-serif;letter-spacing:0;text-align:center}
.site-ai-notice .site-ai-tag{display:inline-block;padding:0 7px;border:1px solid #729e9c;border-radius:4px;color:#bce9de;font-weight:700;letter-spacing:.05em}
.site-ai-notice a{display:inline-flex;align-items:center;min-height:28px;color:#f2d3a2;text-decoration:underline;text-underline-offset:3px;font:inherit;white-space:nowrap}
.site-ai-notice a:focus-visible{outline:2px solid #f2d3a2;outline-offset:3px}
@media(max-width:480px){.site-ai-notice{font-size:11px;padding:7px 12px;gap:2px 8px}.site-ai-notice .site-ai-description{flex-basis:calc(100% - 50px);text-align:left}}</style>
</head>
<body>
<div class="site-ai-notice" data-ai-disclosure="true" role="note" aria-label="KI-Kennzeichnung"><span class="site-ai-tag">KI</span><span class="site-ai-description">Mit KI-Unterstützung entwickelt · Spielgrafiken mit KI erstellt</span><a href="/KI-Hinweis.html">KI-Hinweis</a></div>
<header><div class="bar">
  <a class="brand" href="/">✶ STERNENEPOCHE</a>
  <nav>
    <a href="/">Start</a>
    <a href="/web-client/">Spielen</a>
    <a href="/docs/SPEZIFIKATION.html">Spezifikation</a>
    <a href="/Sternenepoche-Start.html#spielguide">Regelwerk</a>
    <a href="/docs/PROJEKT-README.html">Projekt</a>
    <a href="https://github.com/Sternenepoche/sternenepoche.github.io">Quellcode</a>
  </nav>
</div></header>
<main>
<div class="crumb"><a href="/">Sternenepoche</a> › {{ page.title }}</div>
{{ content }}
</main>
<footer>
  Sternenepoche · Mit KI-Unterstützung entwickelt · <a href="/KI-Hinweis.html">KI-generierte Spielgrafiken</a> ·
  <a href="https://github.com/Sternenepoche/sternenepoche.github.io">Repository</a>
</footer>
</body>
</html>
